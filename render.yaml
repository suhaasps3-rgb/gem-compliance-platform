services:
  - type: web
    name: satark-backend
    env: python
    region: singapore
    buildCommand: pip install --only-binary=:all: PyMuPDF==1.24.9 Pillow==10.2.0 && pip install --prefer-binary -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"