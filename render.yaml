services:
  - type: web
    name: satark-backend
    env: python
    region: singapore
    pythonVersion: "3.11.0"
    buildCommand: pip install --prefer-binary -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"